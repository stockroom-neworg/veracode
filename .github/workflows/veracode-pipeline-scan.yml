name: Veracode Static Pipeline Scanner

on:
  workflow_call:
    inputs:
      policy_name:
        required: true
        type: string
      owner:
        required: true
        type: string
      repo:
        required: true
        type: string
      sha:
        required: true
        type: string
      token:
        required: true
        type: string
      ref:
        required: true
        type: string
      create_code_scanning_alert:
        required: true
        type: boolean
      create_issue:
        required: true
        type: boolean
      check_run_id:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      profile_name:
        required: true
        type: string
      break_build_policy_findings:
        required: true
        type: string
      break_build_on_error:
        required: true
        type: string
      filter_mitigated_flaws:
        required: true
        type: string
      language:
        required: true
        type: string
      default_runs_on:
        required: true
        type: string
      debug:
        required: false
        type: string
        default: 'false'

jobs:
  prepare_pipeline_scan:
    runs-on: ${{ fromJSON(inputs.default_runs_on) }}
    name: Prepare pipeline scan
    outputs:
      matrix_files: ${{ steps.get-files.outputs.matrix_files }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: veracode-artifact
          path: ./veracode_artifact_directory

      - name: Get list of files for matrix
        id: get-files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "veracode_artifact_directory" ]]; then
            echo "::error::Artifact directory was not created."
            exit 1
          fi

          files="$(find veracode_artifact_directory -maxdepth 1 -type f -printf '%f\\n' | jq -R -s -c 'split("\\n") | map(select(length > 0))')"
          if [[ "$files" == "[]" ]]; then
            echo "::error::No files were found in veracode_artifact_directory."
            exit 1
          fi

          echo "Files for matrix: $files"
          echo "matrix_files=$files" >> "$GITHUB_OUTPUT"

  pipeline_scan:
    runs-on: ${{ fromJSON(inputs.default_runs_on) }}
    needs: prepare_pipeline_scan
    name: Veracode pipeline scan
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.prepare_pipeline_scan.outputs.matrix_files) }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.token }}

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: veracode-artifact
          path: ./veracode_artifact_directory

      - name: Debug matrix content
        if: ${{ inputs.debug == 'true' }}
        shell: bash
        run: |
          echo "Current file: ${{ matrix.file }}"
          echo "Matrix job index: ${{ strategy.job-index }}"

      - name: Veracode Pipeline-Scan
        id: pipeline-scan
        uses: veracode/Veracode-pipeline-scan-action@v1.0.25
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          veracode_policy_name: ${{ inputs.policy_name }}
          file: ./veracode_artifact_directory/${{ matrix.file }}
          fail_build: ${{ inputs.break_build_policy_findings }}
          fail_build_error: ${{ inputs.break_build_on_error }}
          summary_output: true
          summary_output_file: ${{ strategy.job-index }}-results.txt
          json_output: true
          json_output_file: ${{ strategy.job-index }}-results.json
          filtered_json_output_file: ${{ strategy.job-index }}-filtered_results.json
          artifact_name: ${{ matrix.file }}
          debug: ${{ inputs.debug == 'true' && '1' || '0' }}
          workflow_app: true

      - name: Prepare pipeline results
        if: ${{ always() }}
        id: prepare-results
        uses: veracode/github-actions-integration-helper@v0.1.12
        with:
          action: preparePipelineResults
          token: ${{ inputs.token }}
          check_run_id: ${{ inputs.check_run_id }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          appname: ${{ inputs.profile_name }}
          source_repository: ${{ inputs.source_repository }}
          fail_checks_on_policy: ${{ inputs.break_build_policy_findings }}
          fail_checks_on_error: ${{ inputs.break_build_on_error }}
          filter_mitigated_flaws: ${{ inputs.filter_mitigated_flaws }}
          filtered_results_file: ${{ strategy.job-index }}-filtered_results.json

      - name: Convert pipeline scan output to SARIF
        if: ${{ inputs.create_code_scanning_alert && always() }}
        uses: veracode/veracode-pipeline-scan-results-to-sarif@v2.0.5
        with:
          pipeline-results-json: mitigated_${{ strategy.job-index }}-filtered_results.json
          output-results-sarif: veracode-results.sarif
          repo_owner: ${{ inputs.owner }}
          repo_name: ${{ inputs.repo }}
          commitSHA: ${{ inputs.sha }}
          ref: ${{ inputs.ref }}
          githubToken: ${{ inputs.token }}

      - name: Create flaws as issues
        if: ${{ inputs.create_issue && always() }}
        uses: veracode/veracode-flaws-to-issues@v2.2.26
        with:
          scan-results-json: mitigated_${{ strategy.job-index }}-filtered_results.json
          repo_owner: ${{ inputs.owner }}
          github-token: ${{ inputs.token }}
          repo_name: ${{ inputs.repo }}
          commitHash: ${{ inputs.sha }}

  update-checks-status:
    runs-on: ${{ fromJSON(inputs.default_runs_on) }}
    needs:
      - prepare_pipeline_scan
      - pipeline_scan
    if: ${{ always() }}
    steps:
      - name: Update check run status
        shell: bash
        env:
          BREAK_BUILD_ON_ERROR: ${{ inputs.break_build_on_error }}
          BREAK_BUILD_ON_POLICY: ${{ inputs.break_build_policy_findings }}
          PIPELINE_SCAN_RESULT: ${{ needs.pipeline_scan.result }}
          PREPARE_RESULT: ${{ needs.prepare_pipeline_scan.result }}
          GH_TOKEN: ${{ inputs.token }}
          REPOSITORY_OWNER: ${{ inputs.owner }}
          REPOSITORY_NAME: ${{ inputs.repo }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}
        run: |
          set -euo pipefail

          conclusion="success"
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            if [[ "$BREAK_BUILD_ON_ERROR" != "false" ]]; then
              conclusion="failure"
            fi
          elif [[ "$PIPELINE_SCAN_RESULT" == "failure" ]]; then
            if [[ "$BREAK_BUILD_ON_ERROR" != "false" || "$BREAK_BUILD_ON_POLICY" != "false" ]]; then
              conclusion="failure"
            fi
          elif [[ "$PIPELINE_SCAN_RESULT" != "success" ]]; then
            conclusion="failure"
          fi

          payload="$(jq -n --arg conclusion "$conclusion" '{status: "completed", conclusion: $conclusion}')"
          curl --fail-with-body --silent --show-error \\
            --request PATCH \\
            --url "https://api.github.com/repos/${REPOSITORY_OWNER}/${REPOSITORY_NAME}/check-runs/${CHECK_RUN_ID}" \\
            --header "Authorization: Bearer ${GH_TOKEN}" \\
            --header "Accept: application/vnd.github+json" \\
            --header "X-GitHub-Api-Version: 2022-11-28" \\
            --header "Content-Type: application/json" \\
            --data "$payload"
